# Uruchamiany ręcznie (zakładka Actions → "Pobierz szczyty z OSM" → Run workflow).
# Odpala scripts/fetch-peaks.mjs i wypisuje wynik w logu oraz jako plik do pobrania.
name: Pobierz szczyty z OSM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-peaks.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: peaks
          path: src/data/peaks.json
