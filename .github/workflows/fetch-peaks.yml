# Uruchamiany ręcznie (zakładka Actions → "Pobierz punkty z OSM" → Run workflow).
# Odpala wybrany skrypt z folderu scripts/ i wypisuje wynik w logu oraz jako plik do pobrania.
name: Pobierz punkty z OSM

on:
  workflow_dispatch:
    inputs:
      what:
        description: Co pobrać
        type: choice
        options: [peaks, passes]
        default: peaks

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-${{ inputs.what }}.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.what }}
          path: src/data/${{ inputs.what }}.json
