# Uruchamiany ręcznie (Actions → "Pobierz szlaki z OSM" → Run workflow).
# Pobiera sieć szlaków Tatr i zapisuje ją w repozytorium jako src/data/trails.json
# (plik jest za duży, żeby przepisywać go z logu jak przy szczytach).
name: Pobierz szlaki z OSM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-trails.mjs
      - name: Zapisz plik w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/data/trails.json
          git diff --cached --quiet || git commit -m "Szlaki Tatr z OSM (automatycznie)"
          git push
