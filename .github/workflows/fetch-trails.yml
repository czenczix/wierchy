# Uruchamiany ręcznie (Actions → "Pobierz szlaki z OSM" → Run workflow).
# Pobiera sieć szlaków wybranego regionu (albo wszystkich) i zapisuje ją w repozytorium
# jako src/data/trails/<region>.json (pliki są za duże, żeby przepisywać je z logu).
name: Pobierz szlaki z OSM

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region
        type: choice
        default: wszystkie
        options: [wszystkie, tatry, beskidy-zachodnie, beskidy-wschodnie, sudety, swietokrzyskie]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pobierz szlaki
        run: |
          if [ "${{ inputs.region }}" = "wszystkie" ]; then
            list=$(node -e "console.log(Object.keys(require('./src/data/trail-regions.json')).join(' '))")
          else
            list="${{ inputs.region }}"
          fi
          for r in $list; do
            echo "::group::$r"
            node scripts/fetch-trails.mjs "$r"
            echo "::endgroup::"
          done
      - name: Zapisz pliki w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/data/trails
          git diff --cached --quiet || git commit -m "Szlaki z OSM: ${{ inputs.region }} (automatycznie)"
          git pull --rebase
          git push
